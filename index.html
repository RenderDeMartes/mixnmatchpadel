<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0d0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marcos · Mix &amp; Match Pádel</title>
<link rel="icon" href="assets/mix-match-logo.png">
<link rel="apple-touch-icon" href="assets/mix-match-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
  <symbol id="i-frames" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><rect x="7" y="7" width="10" height="10"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7 3 17h5V7ZM16 7l5 10h-5V7Z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 7.8-1.2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3 3.8M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v8h14v-8"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.2"/><circle cx="15" cy="15" r="1.2"/><circle cx="15" cy="9" r="1.2"/><circle cx="9" cy="15" r="1.2"/></symbol>
  <symbol id="i-center" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
</svg>

<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <img src="assets/mix-match-logo.png" alt="">
      <div class="brand-text"><b>Marcos</b><span>Mix &amp; Match Pádel</span></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="undo" aria-label="Deshacer" disabled><svg><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="redo" aria-label="Rehacer" disabled><svg><use href="#i-redo"/></svg></button>
      <button class="btn btn-primary" id="exportBtn"><svg><use href="#i-download"/></svg><span>Guardar</span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div class="loading" id="loading"><span></span>Preparando marco…</div>
  </main>

  <aside class="panel" id="panel">
    <div class="selbar" id="selbar" hidden></div>
    <section class="sheet" id="sheet" hidden>
      <div class="sheet-grip" id="sheetGrip"><span></span></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn sheet-close" id="sheetClose" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
    <nav class="tabbar" id="tabbar">
      <button data-tab="frames"><svg><use href="#i-frames"/></svg><span>Marcos</span></button>
      <button data-tab="photo"><svg><use href="#i-photo"/></svg><span>Foto</span></button>
      <button data-tab="add"><svg><use href="#i-plus"/></svg><span>Agregar</span></button>
      <button data-tab="layers"><svg><use href="#i-layers"/></svg><span>Capas</span></button>
      <button data-tab="style"><svg><use href="#i-sliders"/></svg><span>Diseño</span></button>
    </nav>
  </aside>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="dialog" id="exportDialog">
  <form method="dialog" class="dialog-card">
    <div class="dialog-head"><h2>Guardar marco</h2><button class="icon-btn" value="cancel" aria-label="Cerrar"><svg><use href="#i-close"/></svg></button></div>
    <div class="export-preview"><img id="exportPreview" alt="Vista previa"></div>
    <div class="field"><span class="label">Formato</span><div class="chips" id="exportFormat"></div></div>
    <div class="field"><span class="label">Tamaño</span><div class="chips" id="exportSize"></div></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-primary btn-block" id="shareBtn"><svg><use href="#i-share"/></svg><span>Compartir / Guardar en fotos</span></button>
      <button type="button" class="btn btn-block" id="downloadBtn"><svg><use href="#i-download"/></svg><span>Descargar archivo</span></button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="promptDialog">
  <form method="dialog" class="dialog-card">
    <div class="dialog-head"><h2 id="promptTitle"></h2></div>
    <p class="muted" id="promptText"></p>
    <input class="input" id="promptInput" maxlength="40" autocomplete="off">
    <div class="dialog-actions row">
      <button class="btn" value="cancel">Cancelar</button>
      <button class="btn btn-primary" value="ok" id="promptOk">Aceptar</button>
    </div>
  </form>
</dialog>

<script src="js/frame-kit.js"></script>
<script src="js/elements.js"></script>
<script src="js/presets.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
